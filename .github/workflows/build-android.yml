name: Build Android (STÜDYOM)

# Her PR ve main'e her gönderimde: test APK'sı üretir ve Google Play yayın paketinin (AAB)
# derlenebildiğini kontrol eder. İmzalı Play paketi için release-android.yml kullanılır.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build Web Assets (Vite)
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🛠️ Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📦 Build Play Bundle (AAB, imzasız kontrol)
        run: |
          cd android
          ./gradlew bundleRelease
          ls -lh app/build/outputs/bundle/release/

      - name: 🚀 Upload Android APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Studyom-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
