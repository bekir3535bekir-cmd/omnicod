name: Build iOS (STÜDYOM)

# Her PR ve main'e her gönderimde: iOS uygulamasının imzasız derlenebildiğini kontrol eder.
# App Store'a yükleme için release-ios.yml kullanılır.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍎 Build iOS IPA
    # Apple, Nisan 2026'dan beri App Store gönderimlerinde Xcode 26 / iOS 26 SDK istiyor
    runs-on: macos-26

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 🧰 Xcode sürümü
        run: xcodebuild -version

      - name: 📦 Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build Web Assets (Vite)
        run: npm run build

      - name: 🔄 Sync Capacitor iOS
        run: npx cap sync ios

      - name: 🛠️ Build iOS App with Xcode
        run: |
          status=0
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1 || status=$?
          grep -E "BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          exit $status

      - name: 🧾 Hata kaydı (başarısız olursa)
        if: failure()
        run: grep -nE "error:" xcodebuild.log | head -50 || tail -80 xcodebuild.log

      - name: 📦 Package App into IPA
        run: |
          mkdir -p build-output/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/App.app build-output/Payload/
          cd build-output
          zip -qr Studyom.ipa Payload/
          ls -lh Studyom.ipa

      - name: 🚀 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Studyom-iOS
          path: build-output/Studyom.ipa
          retention-days: 14
