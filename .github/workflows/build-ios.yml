name: Build iOS (OmniCod)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm install

      - name: 🔨 Build Web Assets (Vite)
        run: npm run build

      - name: 🔄 Sync Capacitor iOS
        run: npx cap sync ios

      - name: 🛠️ Build iOS App with Xcode
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 📦 Package App into IPA
        run: |
          mkdir -p build-output/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/App.app build-output/Payload/
          cd build-output
          zip -qr OmniCod.ipa Payload/
          ls -lh OmniCod.ipa

      - name: 🚀 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniCod-iOS
          path: build-output/OmniCod.ipa
          retention-days: 14
