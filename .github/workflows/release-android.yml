name: Release Android (Google Play)

# Elle başlatılır (Actions → Release Android → Run workflow).
# İmzalı Google Play paketi (AAB) üretir; Play Console'a yüklemek için indirilecek dosya olarak bırakır.
#
# Gerekli GitHub Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    yükleme anahtarı dosyasının (.jks) base64 hâli
#   ANDROID_KEYSTORE_PASSWORD  anahtar deposu şifresi
#   ANDROID_KEY_ALIAS          anahtar adı (alias)
#   ANDROID_KEY_PASSWORD       anahtar şifresi
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sürüm adı (kullanıcıya görünen, örn. 1.0.1)"
        required: true
        default: "1.0.0"

jobs:
  release-android:
    name: 📦 Play paketi (imzalı AAB)
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Gizli bilgiler tanımlı mı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Eksik GitHub Secrets:$missing"; exit 1; fi

      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build Web Assets (Vite)
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Yükleme anahtarını yerleştir
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: 🛠️ İmzalı AAB üret
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Play her yüklemede daha büyük versionCode ister
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease
          ls -lh app/build/outputs/bundle/release/

      - name: ✅ İmza doğrulama
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: 🧹 Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: 🚀 AAB'yi indirilebilir bırak
        uses: actions/upload-artifact@v5
        with:
          name: Studyom-Play-${{ inputs.version_name }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
