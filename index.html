<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniCod" />
    <title>OmniCod — Fotoğrafçılık & Stüdyo Yönetim Sistemi</title>
    <style>
      html {
        background-color: #0A0A0B;
      }
      body {
        margin: 0 auto;
        padding: 0;
        background-color: #0A0A0B;
        color: #EDE8DF;
        min-height: 100vh;
        max-width: 430px;
        overflow-x: hidden;
        font-family: 'Inter', sans-serif;
      }
      #root {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        background-color: #0A0A0B;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          // Localhost / geliştirme ortamında Service Worker'ı temizle (beyaz ekran ve önbellek sorunlarını önler)
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(keys => {
              keys.forEach(k => caches.delete(k));
            });
          }
        } else {
          // Canlı ortamda Service Worker'ı kaydet
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
