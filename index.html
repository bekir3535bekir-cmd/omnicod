<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STÜDYOM" />
    <title>STÜDYOM — Fotoğrafçılık & Stüdyo Yönetim Sistemi</title>
    <style>
      html {
        background-color: #0A0A0B;
      }
      body {
        margin: 0 auto;
        padding: 0;
        background-color: #0A0A0B;
        color: #EDE8DF;
        min-height: 100vh;
        max-width: 430px;
        overflow-x: hidden;
        font-family: 'Inter', sans-serif;
      }
      #root {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        background-color: #0A0A0B;
      }
      /* Masaüstü düzeni (geniş ekran) */
      html.desktop body, html.desktop #root { max-width: none; }
      html.desktop { --fab-right: 28px; --fab-bottom-1: 24px; --fab-bottom-2: 82px; }
      /* Masaüstünde kart listeleri iki sütun */
      html.desktop .card-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
      html.desktop .card-list > * { margin-bottom: 0 !important; }
      html.desktop .card-list > :only-child { grid-column: 1 / -1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service Worker yalnızca web sürümünde (masaüstü/telefon uygulamasında gerekmez)
      if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.studyomDesktop) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          // Localhost / geliştirme ortamında Service Worker'ı temizle (beyaz ekran ve önbellek sorunlarını önler)
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(keys => {
              keys.forEach(k => caches.delete(k));
            });
          }
        } else {
          // Canlı ortamda Service Worker'ı kaydet
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
